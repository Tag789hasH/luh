<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message For You ✨💙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            overflow: hidden;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 25px;
            border: 2px solid rgba(144, 224, 239, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 30px rgba(0, 180, 216, 0.2);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 1.5s ease-out;
        }

        .welcome-card h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #90e0ef;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 180, 216, 0.6);
        }

        .welcome-card p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #e0f7fa;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .btn-open {
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #90e0ef 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.4rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 119, 182, 0.5), 0 0 20px rgba(0, 180, 216, 0.7);
            text-decoration: none;
            display: inline-block;
        }

        .btn-open:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 40px rgba(0, 180, 216, 0.8), 0 0 30px rgba(144, 224, 239, 0.9);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Background Audio (Change 'your-song.mp3' to your actual uploaded song filename) -->
    <audio id="bgMusic" loop>
        <source src="AUD-20261107-WA0021.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="welcome-card">
        <h1>For You 💙</h1>
        <p>I made something special just for you. Please turn up your volume and click below to open it.</p>
        <button class="btn-open" onclick="openApologySite()">Open With Music ✨</button>
    </div>

    <script>
        function openApologySite() {
            const music = document.getElementById('bgMusic');
            
            // Play music user interaction trigger
            music.play().catch(error => {
                console.log("Audio play error:", error);
            });

            // Save state in browser session so the music continues smoothly on the next page
            // (Note: For seamless music cross-page continuation, keeping it on a single page or using local storage helps, 
            // but the easiest way is to transition after a tiny moment or use a query parameter)
            
            setTimeout(() => {
                window.location.href = "apology.html";
            }, 400); // Small smooth delay
        }
    </script>
</body>
</html>
